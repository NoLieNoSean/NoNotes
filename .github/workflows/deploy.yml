name: Deploy Quartz site to GitHub Pages
 
on:
  push:
    branches:
      - v4
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci

      - name: Generate build info
        shell: bash
        run: |
          cat > quartz/util/buildInfo.ts <<EOF
          export const gitHash = "$(git rev-parse --short HEAD)"
          export const gitFullHash = "$GITHUB_SHA"
          export const gitBranch = "$GITHUB_REF_NAME"
          export const gitCommit = $(node -p "JSON.stringify(require('child_process').execSync('git log -1 --pretty=%s').toString().trim())")
          EOF
          
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
 
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4