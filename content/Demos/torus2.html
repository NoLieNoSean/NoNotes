<!-- <!DOCTYPE html>

    <style>

</head>
<body>
    <div id="controls">
        <h2>Torus in S³</h2>
        <div class="subtitle">Ball model: B³ with ∂B³ identified to a point</div>
        
        <label>Direction 1 (x₁↔x₃): <input type="range" id="t1" min="-1.57" max="1.57" step="0.01" value="0"><span class="val" id="v1">0.00</span></label>
        <label>Direction 2 (x₂↔x₄): <input type="range" id="t2" min="-1.57" max="1.57" step="0.01" value="0"><span class="val" id="v2">0.00</span></label>
        <label>Direction 3 (x₁↔x₄): <input type="range" id="t3" min="-1.57" max="1.57" step="0.01" value="0"><span class="val" id="v3">0.00</span></label>
        
        <hr>
        
        <label>Torus R (r=√(1−R²)): <input type="range" id="R" min="0.05" max="0.95" step="0.01" value="0.707"><span class="val" id="vR">0.707</span></label>
        
        <hr>
        
        <div>
            <label class="checkbox-label"><input type="checkbox" id="showBoundary" checked> ∂B³</label>
            <label class="checkbox-label"><input type="checkbox" id="showWireframe" checked> Wireframe</label>
        </div>
        <div style="margin-top: 8px;">
            <label class="curve-label label-l"><input type="checkbox" id="showL" checked> <b>l</b> longitudinal</label>
            <label class="curve-label label-m"><input type="checkbox" id="showM" checked> <b>m</b> meridional</label>
        </div>
        <div style="margin-top: 8px;">
            <label class="checkbox-label"><input type="checkbox" id="showMarkers" checked> Direction markers</label>
        </div>
        
        <hr>
        
        <div style="font-size: 12px; color: #a0a0ff; margin-bottom: 5px;"><b>Curve Settings</b></div>
        <label>Loc of <span id="lblLocL" style="color:#ff6060">l</span> (β): <input type="range" id="locL" min="0" max="6.283" step="0.01" value="0"><span class="val" id="vLocL">0.00</span></label>
        <label class="checkbox-label"><input type="checkbox" id="revL"> Reverse <span id="lblRevL" style="color:#ff6060">l</span></label>
        
        <label>Loc of <span id="lblLocM" style="color:#60ff60">m</span> (α): <input type="range" id="locM" min="0" max="6.283" step="0.01" value="0"><span class="val" id="vLocM">0.00</span></label>
        <label class="checkbox-label"><input type="checkbox" id="revM"> Reverse <span id="lblRevM" style="color:#60ff60">m</span></label>
        
        <div style="margin-top: 12px;">
            <button id="resetBtn">Reset</button>
            <button id="animateBtn">Stop</button>
            <button id="swapColorsBtn" title="Swap colors of l and m">🔄 Swap Colors</button>
        </div</div>
    </div>
    
    <div id="info">
        <b>S³ = B³ ∪ {∞}</b> — the 3-sphere as a 3-ball with boundary collapsed to a single point.<br>
        <span class="red"><b>l</b></span> = longitudinal curve (α varies, fixed β) &nbsp;|&nbsp; 
        <span class="green"><b>m</b></span> = meridional curve (β varies, fixed α)<br>
        <span class="yellow"><b>∞</b></span> = In the ℝ³ view, this marker shows the relative motion of the point at infinity. When it intersects the rigid torus here, the torus touches the boundary in the S³ view.<br>
        <em>Drag to orbit • Scroll to zoom • Use sliders to move the torus</em>
    </div>

    <div id="divider"></div>
    <div id="labelS3">S³ Ball Model (Torus moves, Boundary fixed)</div>
    <div id="labelR3">ℝ³ View (Torus rigid, Infinity point '∞' moves)</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // ============================================================
        // SCENE SETUP
        // ============================================================
        const sceneS3 = new THREE.Scene();
        sceneS3.background = new THREE.Color(0x0a0a1a);
        sceneS3.fog = new THREE.Fog(0x0a0a1a, 8, 20);

        const sceneR3 = new THREE.Scene();
        sceneR3.background = new THREE.Color(0x050510);

        const cameraS3 = new THREE.PerspectiveCamera(50, (window.innerWidth / 2) / window.innerHeight, 0.1, 100);
        cameraS3.position.set(0, 0.5, 3.2);

        const cameraR3 = new THREE.PerspectiveCamera(50, (window.innerWidth / 2) / window.innerHeight, 0.1, 100);
        cameraR3.position.set(0, 0.5, 3.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(cameraS3, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 1.5;
        controls.maxDistance = 8;
        controls.addEventListener('change', () => {
            const offset = new THREE.Vector3().copy(cameraS3.position).sub(controls.target);
            cameraR3.position.copy(controls.target).add(offset);
            cameraR3.quaternion.copy(cameraS3.quaternion);
        });

        // ============================================================
        // LIGHTING (Shared logic, applied to both scenes)
        // ============================================================
        function addLighting(scene) {
            scene.add(new THREE.AmbientLight(0x505070, 0.6));
            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight1.position.set(3, 4, 5);
            scene.add(dirLight1);
            const dirLight2 = new THREE.DirectionalLight(0x6060ff, 0.4);
            dirLight2.position.set(-3, -2, -4);
            scene.add(dirLight2);
            const pointLight = new THREE.PointLight(0xff8040, 0.3, 10);
            pointLight.position.set(0, 2, 0);
            scene.add(pointLight);
        }
        addLighting(sceneS3);
        addLighting(sceneR3);

        // ============================================================
        // BOUNDARY SPHERE (∂B³) - S3 ONLY
        // ============================================================
        const boundaryGroup = new THREE.Group();
        const boundaryWire = new THREE.Mesh(
            new THREE.SphereGeometry(1, 48, 48),
            new THREE.MeshBasicMaterial({ color: 0x4466ff, wireframe: true, transparent: true, opacity: 0.2 })
        );
        boundaryGroup.add(boundaryWire);
        const boundarySolid = new THREE.Mesh(
            new THREE.SphereGeometry(1, 48, 48),
            new THREE.MeshPhongMaterial({ color: 0x1a1a66, transparent: true, opacity: 0.04, side: THREE.DoubleSide, depthWrite: false })
        );
        boundaryGroup.add(boundarySolid);
        sceneS3.add(boundaryGroup);

        // ============================================================
        // GEOMETRY SETUP
        // ============================================================
        const NA = 144;
        const NB = 144;
        const NUM_CURVE_PTS = 256;
        const NUM_MARKERS = 12;

        const torusGeom = new THREE.BufferGeometry();
        const indices = [];
        for (let i = 0; i < NA; i++) {
            for (let j = 0; j < NB; j++) {
                const a = (i + 1) % NA;
                const b = (j + 1) % NB;
                const i00 = i * NB + j;
                const i10 = a * NB + j;
                const i01 = i * NB + b;
                const i11 = a * NB + b;
                indices.push(i00, i10, i01);
                indices.push(i10, i11, i01);
            }
        }
        torusGeom.setIndex(indices);
        torusGeom.setAttribute('position', new THREE.Float32BufferAttribute(new Array(NA * NB * 3).fill(0), 3));
        torusGeom.setAttribute('color', new THREE.Float32BufferAttribute(new Array(NA * NB * 3).fill(0), 3));

        const torusMat = new THREE.MeshPhongMaterial({
            vertexColors: true, side: THREE.DoubleSide, shininess: 80, specular: 0x404060, transparent: true, opacity: 0.85
        });
        const wireframeMat = new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true, transparent: true, opacity: 0.06 });

        const torusMesh = new THREE.Mesh(torusGeom, torusMat);
        sceneS3.add(torusMesh);
        const wireframeMesh = new THREE.Mesh(torusGeom, wireframeMat);
        sceneS3.add(wireframeMesh);

        // Rigid Geometry for R3 View
        const rigidTorusGeom = new THREE.BufferGeometry();
        rigidTorusGeom.setIndex(indices);
        rigidTorusGeom.setAttribute('position', new THREE.Float32BufferAttribute(new Array(NA * NB * 3).fill(0), 3));
        rigidTorusGeom.setAttribute('color', new THREE.Float32BufferAttribute(new Array(NA * NB * 3).fill(0), 3));
        
        const rigidTorusMesh = new THREE.Mesh(rigidTorusGeom, torusMat);
        sceneR3.add(rigidTorusMesh);
        const rigidWireframeMesh = new THREE.Mesh(rigidTorusGeom, wireframeMat);
        sceneR3.add(rigidWireframeMesh);

        // ============================================================
        // CURVES & MARKERS SETUP
        // ============================================================
        function createCurveAndMarkers(scene, colorHex, emissiveHex) {
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.Float32BufferAttribute(new Array(NUM_CURVE_PTS * 3).fill(0), 3));
            const mat = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 2, transparent: true, opacity: 0.95, depthTest: true });
            const line = new THREE.Line(geom, mat);
            line.renderOrder = 2;
            scene.add(line);

            const markerGeom = new THREE.ConeGeometry(0.018, 0.045, 6);
            const markerMat = new THREE.MeshPhongMaterial({ color: colorHex, emissive: emissiveHex, shininess: 60 });
            const markers = [];
            const group = new THREE.Group();
            group.renderOrder = 3;
            for (let i = 0; i < NUM_MARKERS; i++) {
                const cone = new THREE.Mesh(markerGeom, markerMat);
                group.add(cone);
                markers.push(cone);
            }
            scene.add(group);
            return { geom, mat, markers, group };
        }

        const curveL_S3 = createCurveAndMarkers(sceneS3, 0xff3030, 0x401010);
        const curveM_S3 = createCurveAndMarkers(sceneS3, 0x30ff30, 0x104010);
        const curveL_R3 = createCurveAndMarkers(sceneR3, 0xff3030, 0x401010);
        const curveM_R3 = createCurveAndMarkers(sceneR3, 0x30ff30, 0x104010);

        // Infinity Marker for R3 View
        const infinityMarkerGeom = new THREE.SphereGeometry(0.08, 32, 32);
        const infinityMarkerMat = new THREE.MeshPhongMaterial({ color: 0xffff00, emissive: 0xffaa00, emissiveIntensity: 0.8, transparent: true, opacity: 0.9 });
        const infinityMarker = new THREE.Mesh(infinityMarkerGeom, infinityMarkerMat);
        sceneR3.add(infinityMarker);

        const canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.font = 'bold 80px Arial';
        ctx.fillStyle = '#ffff00';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('∞', 64, 64);
        const texture = new THREE.CanvasTexture(canvas);
        const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
        const infinitySprite = new THREE.Sprite(spriteMat);
        infinitySprite.scale.set(0.6, 0.6, 1);
        infinityMarker.add(infinitySprite);

        // ============================================================
        // COLOR STATE
        // ============================================================
        let colorL = { r: 0xff, g: 0x30, b: 0x30 };
        let colorM = { r: 0x30, g: 0xff, b: 0x30 };

        function applyColors() {
            const setMatColor = (mat, c) => {
                mat.color.setRGB(c.r / 255, c.g / 255, c.b / 255);
                if (mat.emissive) mat.emissive.setRGB(c.r / 5 / 255, c.g / 5 / 255, c.b / 5 / 255);
            };
            setMatColor(curveL_S3.mat, colorL);
            setMatColor(curveM_S3.mat, colorM);
            setMatColor(curveL_R3.mat, colorL);
            setMatColor(curveM_R3.mat, colorM);

            const hexL = '#' + colorL.r.toString(16).padStart(2,'0') + colorL.g.toString(16).padStart(2,'0') + colorL.b.toString(16).padStart(2,'0');
            const hexM = '#' + colorM.r.toString(16).padStart(2,'0') + colorM.g.toString(16).padStart(2,'0') + colorM.b.toString(16).padStart(2,'0');
            
            document.getElementById('lblLocL').style.color = hexL;
            document.getElementById('lblRevL').style.color = hexL;
            document.getElementById('lblLocM').style.color = hexM;
            document.getElementById('lblRevM').style.color = hexM;
            document.getElementById('infoLblL') && (document.getElementById('infoLblL').style.color = hexL);
            document.getElementById('infoLblM') && (document.getElementById('infoLblM').style.color = hexM);
        }

        function swapColors() {
            const temp = { ...colorL };
            colorL = { ...colorM };
            colorM = { ...temp };
            applyColors();
        }

        // ============================================================
        // PROJECTION HELPERS
        // ============================================================
        function projectToBall(x1, x2, x3, x4) {
            const x4sq = x4 * x4;
            const s = Math.sqrt(Math.max(0, 1 - x4sq));
            const denom = 1 - x4 + s;
            if (denom < 1e-4) {
                const norm = Math.sqrt(x1*x1 + x2*x2 + x3*x3);
                return norm < 1e-6 ? [0, 0, 0.999] : [x1/norm * 0.999, x2/norm * 0.999, x3/norm * 0.999];
            }
            let U = x1 / denom, V = x2 / denom, W = x3 / denom;
            const dist = Math.sqrt(U*U + V*V + W*W);
            if (dist > 0.999) {
                const scale = 0.999 / dist;
                U *= scale; V *= scale; W *= scale;
            }
            return [U, V, W];
        }

        function projectToR3(x1, x2, x3, x4) {
            const denom = 1 - x4;
            if (denom < 1e-4) return null;
            return [x1 / denom, x2 / denom, x3 / denom];
        }

        function transformPoint(x1, x2, x3, x4, cosT1, sinT1, cosT2, sinT2, cosT3, sinT3) {
            let nx1 = x1 * cosT1 - x3 * sinT1;
            let nx3 = x1 * sinT1 + x3 * cosT1;
            x1 = nx1; x3 = nx3;
            
            let nx2 = x2 * cosT2 - x4 * sinT2;
            let nx4 = x2 * sinT2 + x4 * cosT2;
            x2 = nx2; x4 = nx4;
            
            nx1 = x1 * cosT3 - x4 * sinT3;
            nx4 = x1 * sinT3 + x4 * cosT3;
            x1 = nx1; x4 = nx4;
            
            return projectToBall(x1, x2, x3, x4);
        }

        // ============================================================
        // UPDATE FUNCTIONS
        // ============================================================
        const _up = new THREE.Vector3(0, 1, 0);
        const _dir = new THREE.Vector3();
        const _pos = new THREE.Vector3();
        const _posNext = new THREE.Vector3();
        const _quat = new THREE.Quaternion();
        let lastInfinityDir = new THREE.Vector3(0, 1, 0);

        function updateRigidScene(R, betaLocL, alphaLocM, revL, revM) {
            const r = Math.sqrt(Math.max(0, 1 - R * R));
            const color = new THREE.Color();

            // Rigid Torus
            const rPos = rigidTorusGeom.attributes.position.array;
            const rCol = rigidTorusGeom.attributes.color.array;
            for (let i = 0; i < NA; i++) {
                const alpha = (i / NA) * 2 * Math.PI;
                const cosA = Math.cos(alpha), sinA = Math.sin(alpha);
                for (let j = 0; j < NB; j++) {
                    const beta = (j / NB) * 2 * Math.PI;
                    const cosB = Math.cos(beta), sinB = Math.sin(beta);
                    const proj = projectToR3(R * cosA, R * sinA, r * cosB, r * sinB) || [0,0,0];
                    const idx = (i * NB + j) * 3;
                    rPos[idx] = proj[0]; rPos[idx+1] = proj[1]; rPos[idx+2] = proj[2];
                    color.setHSL(alpha / (2 * Math.PI), 0.7, 0.3 + 0.45 * ((r * sinB + 1) / 2));
                    rCol[idx] = color.r; rCol[idx+1] = color.g; rCol[idx+2] = color.b;
                }
            }
            rigidTorusGeom.attributes.position.needsUpdate = true;
            rigidTorusGeom.attributes.color.needsUpdate = true;

            // Helper to update curves and markers
            const updateCurve = (curveObj, isL) => {
                const posArr = curveObj.geom.attributes.position.array;
                const pts = [];
                for (let k = 0; k < NUM_CURVE_PTS; k++) {
                    const t = (k / NUM_CURVE_PTS) * 2 * Math.PI;
                    const angle = (isL ? revL : revM) ? (2 * Math.PI - t) : t;
                    const fixedAngle = isL ? betaLocL : alphaLocM;
                    const x1 = isL ? R * Math.cos(angle) : R * Math.cos(fixedAngle);
                    const x2 = isL ? R * Math.sin(angle) : R * Math.sin(fixedAngle);
                    const x3 = isL ? r * Math.cos(fixedAngle) : r * Math.cos(angle);
                    const x4 = isL ? r * Math.sin(fixedAngle) : r * Math.sin(angle);
                    const proj = projectToR3(x1, x2, x3, x4) || [0,0,0];
                    posArr[k*3] = proj[0]; posArr[k*3+1] = proj[1]; posArr[k*3+2] = proj[2];
                    pts.push(proj);
                }
                curveObj.geom.attributes.position.needsUpdate = true;

                for (let k = 0; k < NUM_MARKERS; k++) {
                    const idx = Math.floor((k / NUM_MARKERS) * NUM_CURVE_PTS);
                    const idxNext = (idx + 1) % NUM_CURVE_PTS;
                    _pos.set(pts[idx][0], pts[idx][1], pts[idx][2]);
                    _posNext.set(pts[idxNext][0], pts[idxNext][1], pts[idxNext][2]);
                    _dir.subVectors(_posNext, _pos).normalize();
                    if (_dir.length() > 1e-6) {
                        _quat.setFromUnitVectors(_up, _dir);
                        curveObj.markers[k].quaternion.copy(_quat);
                    }
                    curveObj.markers[k].position.copy(_pos);
                }
            };

            updateCurve(curveL_R3, true);
            updateCurve(curveM_R3, false);
        }

        function updateTorus(t1, t2, t3, R) {
            const r = Math.sqrt(Math.max(0, 1 - R * R));
            const positions = torusGeom.attributes.position.array;
            const colors = torusGeom.attributes.color.array;
            
            const cosT1 = Math.cos(t1), sinT1 = Math.sin(t1);
            const cosT2 = Math.cos(t2), sinT2 = Math.sin(t2);
            const cosT3 = Math.cos(t3), sinT3 = Math.sin(t3);
            
            const color = new THREE.Color();
            let maxDist = 0;
            
            const betaLocL = parseFloat(document.getElementById('locL').value);
            const alphaLocM = parseFloat(document.getElementById('locM').value);
            const revL = document.getElementById('revL').checked;
            const revM = document.getElementById('revM').checked;
            
            document.getElementById('vLocL').textContent = betaLocL.toFixed(2);
            document.getElementById('vLocM').textContent = alphaLocM.toFixed(2);

            // Update S3 Torus
            for (let i = 0; i < NA; i++) {
                const alpha = (i / NA) * 2 * Math.PI;
                const cosA = Math.cos(alpha), sinA = Math.sin(alpha);
                for (let j = 0; j < NB; j++) {
                    const beta = (j / NB) * 2 * Math.PI;
                    const cosB = Math.cos(beta), sinB = Math.sin(beta);
                    const [U, V, W] = transformPoint(R * cosA, R * sinA, r * cosB, r * sinB, cosT1, sinT1, cosT2, sinT2, cosT3, sinT3);
                    const idx = (i * NB + j) * 3;
                    positions[idx] = U; positions[idx + 1] = V; positions[idx + 2] = W;
                    const d = Math.sqrt(U*U + V*V + W*W);
                    if (d > maxDist) maxDist = d;
                    color.setHSL(alpha / (2 * Math.PI), 0.7, 0.3 + 0.45 * ((r * sinB + 1) / 2));
                    colors[idx] = color.r; colors[idx + 1] = color.g; colors[idx + 2] = color.b;
                }
            }
            torusGeom.attributes.position.needsUpdate = true;
            torusGeom.attributes.color.needsUpdate = true;
            torusGeom.computeVertexNormals();

            // Update S3 Curves
            const updateCurveS3 = (curveObj, isL) => {
                const posArr = curveObj.geom.attributes.position.array;
                const pts = [];
                for (let k = 0; k < NUM_CURVE_PTS; k++) {
                    const t = (k / NUM_CURVE_PTS) * 2 * Math.PI;
                    const angle = (isL ? revL : revM) ? (2 * Math.PI - t) : t;
                    const fixedAngle = isL ? betaLocL : alphaLocM;
                    const x1 = isL ? R * Math.cos(angle) : R * Math.cos(fixedAngle);
                    const x2 = isL ? R * Math.sin(angle) : R * Math.sin(fixedAngle);
                    const x3 = isL ? r * Math.cos(fixedAngle) : r * Math.cos(angle);
                    const x4 = isL ? r * Math.sin(fixedAngle) : r * Math.sin(angle);
                    const proj = transformPoint(x1, x2, x3, x4, cosT1, sinT1, cosT2, sinT2, cosT3, sinT3);
                    posArr[k*3] = proj[0]; posArr[k*3+1] = proj[1]; posArr[k*3+2] = proj[2];
                    pts.push(proj);
                }
                curveObj.geom.attributes.position.needsUpdate = true;
                for (let k = 0; k < NUM_MARKERS; k++) {
                    const idx = Math.floor((k / NUM_MARKERS) * NUM_CURVE_PTS);
                    const idxNext = (idx + 1) % NUM_CURVE_PTS;
                    _pos.set(pts[idx][0], pts[idx][1], pts[idx][2]);
                    _posNext.set(pts[idxNext][0], pts[idxNext][1], pts[idxNext][2]);
                    _dir.subVectors(_posNext, _pos).normalize();
                    if (_dir.length() > 1e-6) {
                        _quat.setFromUnitVectors(_up, _dir);
                        curveObj.markers[k].quaternion.copy(_quat);
                    }
                    curveObj.markers[k].position.copy(_pos);
                }
            };
            updateCurveS3(curveL_S3, true);
            updateCurveS3(curveM_S3, false);

            // Update Infinity Marker in R3 View
            const nx1 = Math.sin(t3) * Math.cos(t1);
            const nx2 = Math.cos(t3) * Math.sin(t2);
            const nx3 = -Math.sin(t3) * Math.sin(t1);
            const nx4 = Math.cos(t3) * Math.cos(t2);
            const denom = 1 - nx4;
            
            if (denom < 0.01) {
                const norm = Math.sqrt(nx1*nx1 + nx2*nx2 + nx3*nx3);
                if (norm > 1e-6) lastInfinityDir.set(nx1/norm, nx2/norm, nx3/norm);
                infinityMarker.position.copy(lastInfinityDir).multiplyScalar(8);
                infinityMarker.scale.set(3, 3, 3);
            } else {
                const U = nx1 / denom, V = nx2 / denom, W = nx3 / denom;
                infinityMarker.position.set(U, V, W);
                const dist = Math.sqrt(U*U + V*V + W*W);
                lastInfinityDir.set(U/dist, V/dist, W/dist);
                const scale = Math.max(0.5, Math.min(2.5, dist * 0.3 + 0.5));
                infinityMarker.scale.set(scale, scale, scale);
            }

            // Boundary glow
            const glow = Math.max(0, (maxDist - 0.75) / 0.25);
            boundaryWire.material.opacity = 0.15 + 0.4 * glow;
            boundaryWire.material.color.setHSL(0.65, 0.6, 0.4 + 0.3 * glow);

            // Sync Rigid Scene visibility
            curveL_R3.group.visible = curveM_R3.group.visible = document.getElementById('showMarkers').checked;
            curveL_R3.mat.visible = document.getElementById('showL').checked;
            curveM_R3.mat.visible = document.getElementById('showM').checked;
        }

        // ============================================================
        // UI CONTROLS
        // ============================================================
        const slider1 = document.getElementById('t1');
        const slider2 = document.getElementById('t2');
        const slider3 = document.getElementById('t3');
        const sliderR = document.getElementById('R');

        function onInput() {

            document.getElementById('v1').textContent = t1.toFixed(2);
            document.getElementById('v2').textContent = t2.toFixed(2);
            document.getElementById('v3').textContent = t3.toFixed(2);
            document.getElementById('vR').textContent = R.toFixed(3);
            
            updateRigidScene(R, parseFloat(document.getElementById('locL').value), parseFloat(document.getElementById('locM').value), document.getElementById('revL').checked, document.getElementById('revM').checked);
            updateTorus(t1, t2, t3, R);
            
            boundaryGroup.visible = document.getElementById('showBoundary').checked;
            wireframeMesh.visible = document.getElementById('showWireframe').checked;
            curveL_S3.mat.visible = document.getElementById('showL').checked;
            curveM_S3.mat.visible = document.getElementById('showM').checked;
            curveL_S3.group.visible = curveM_S3.group.visible = document.getElementById('showMarkers').checked;
        }

        [slider1, slider2, slider3, sliderR, document.getElementById('locL'), document.getElementById('locM')].forEach(el => {
            el.addEventListener('input', onInput);
        });
        [document.getElementById('showBoundary'), document.getElementById('showWireframe'), document.getElementById('showL'), document.getElementById('showM'), document.getElementById('showMarkers'), document.getElementById('revL'), document.getElementById('revM')].forEach(el => {

        document.getElementById('resetBtn').addEventListener('click', () => {

            document.getElementById('locL').value = 0;

    <script>
        // ============================================================
        // SCENE SETUP
        // ============================================================
        const sceneS3 = new THREE.Scene();
        sceneS3.background = new THREE.Color(0x0a0a1a);
        sceneS3.fog = new THREE.Fog(0x0a0a1a, 8, 20);

        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const controls = new THREE.OrbitControls(cameraS3, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;

        controls.maxDistance = 8;
        controls.addEventListener('change', () => {
            const offset = new THREE.Vector3().copy(cameraS3.position).sub(controls.target);
            cameraR3.position.copy(controls.target).add(offset);
            cameraR3.quaternion.copy(cameraS3.quaternion);
        });

        // ============================================================
        // LIGHTING
        // ============================================================
        function addLighting(scene) {
            scene.add(new THREE.AmbientLight(0x505070, 0.6));
            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight1.position.set(3, 4, 5);
            scene.add(dirLight1);
            const dirLight2 = new THREE.DirectionalLight(0x6060ff, 0.4);
            dirLight2.position.set(-3, -2, -4);
            scene.add(dirLight2);
            const pointLight = new THREE.PointLight(0xff8040, 0.3, 10);
            pointLight.position.set(0, 2, 0);
            scene.add(pointLight);
        }
        addLighting(sceneS3);
        addLighting(sceneR3);

        // ============================================================
        // S3 GROUP (Scaled to match R3 visual zoom)
        // ============================================================
        const s3Group = new THREE.Group();
        // Scale factor ~2.4 matches the max extent of the R3 torus (1/R + r/R) to the S3 ball radius (1.0)
        s3Group.scale.set(2.4, 2.4, 2.4);
        sceneS3.add(s3Group);

        // ============================================================
        // BOUNDARY SPHERE (∂B³) - S3 ONLY
        // ============================================================
        const boundaryGroup = new THREE.Group();
        const boundaryWire = new THREE.Mesh(
            new THREE.SphereGeometry(1, 48, 48),
            new THREE.MeshBasicMaterial({ color: 0x4466ff, wireframe: true, transparent: true, opacity: 0.2 })
        );
        boundaryGroup.add(boundaryWire);
        const boundarySolid = new THREE.Mesh(
            new THREE.SphereGeometry(1, 48, 48),
            new THREE.MeshPhongMaterial({ color: 0x1a1a66, transparent: true, opacity: 0.04, side: THREE.DoubleSide, depthWrite: false })
        );
        boundaryGroup.add(boundarySolid);
        s3Group.add(boundaryGroup);

        // ============================================================
        // GEOMETRY SETUP
        // ============================================================
        const NA = 144;
        const NB = 144;
        const NUM_CURVE_PTS = 256;
        const NUM_MARKERS = 12;

        const torusGeom = new THREE.BufferGeometry();
        const indices = [];
        for (let i = 0; i < NA; i++) {
            for (let j = 0; j < NB; j++) {
                const a = (i + 1) % NA;
                const b = (j + 1) % NB;
                const i00 = i * NB + j;
                const i10 = a * NB + j;
                const i01 = i * NB + b;
                const i11 = a * NB + b;
                indices.push(i00, i10, i01);
                indices.push(i10, i11, i01);
            }
        }
        torusGeom.setIndex(indices);
        torusGeom.setAttribute('position', new THREE.Float32BufferAttribute(new Array(NA * NB * 3).fill(0), 3));
        torusGeom.setAttribute('color', new THREE.Float32BufferAttribute(new Array(NA * NB * 3).fill(0), 3));

        const torusMat = new THREE.MeshPhongMaterial({
            vertexColors: true, side: THREE.DoubleSide, shininess: 80, specular: 0x404060, transparent: true, opacity: 0.85
        });
        const wireframeMat = new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true, transparent: true, opacity: 0.06 });

        const torusMesh = new THREE.Mesh(torusGeom, torusMat);
        s3Group.add(torusMesh);
        const wireframeMesh = new THREE.Mesh(torusGeom, wireframeMat);
        s3Group.add(wireframeMesh);

        // ============================================================
        // CURVES & MARKERS SETUP HELPER
        // ============================================================
        function createCurveAndMarkers(parent, colorHex, emissiveHex) {
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.Float32BufferAttribute(new Array(NUM_CURVE_PTS * 3).fill(0), 3));
            const mat = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 2, transparent: true, opacity: 0.95, depthTest: true });
            const line = new THREE.Line(geom, mat);
            line.renderOrder = 2;
            parent.add(line);

            const markerGeom = new THREE.ConeGeometry(0.018, 0.045, 6);
            const markerMat = new THREE.MeshPhongMaterial({ color: colorHex, emissive: emissiveHex, shininess: 60 });
            const markers = [];
            const group = new THREE.Group();
            group.renderOrder = 3;
            for (let i = 0; i < NUM_MARKERS; i++) {
                const cone = new THREE.Mesh(markerGeom, markerMat);
                group.add(cone);
                markers.push(cone);
            }
            parent.add(group);
            return { geom, mat, markers, group, line };
        }

        const curveL_S3 = createCurveAndMarkers(s3Group, 0xff3030, 0x401010);
        const curveM_S3 = createCurveAndMarkers(s3Group, 0x30ff30, 0x104010);
        const curveL_R3 = createCurveAndMarkers(sceneR3, 0xff3030, 0x401010);
        const curveM_R3 = createCurveAndMarkers(sceneR3, 0x30ff30, 0x104010);

        // Infinity Marker for R3 View
        const infinityMarkerGeom = new THREE.SphereGeometry(0.08, 32, 32);
        const infinityMarkerMat = new THREE.MeshPhongMaterial({ color: 0xffff00, emissive: 0xffaa00, emissiveIntensity: 0.8, transparent: true, opacity: 0.9 });
        const infinityMarker = new THREE.Mesh(infinityMarkerGeom, infinityMarkerMat);
        sceneR3.add(infinityMarker);

        const canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.font = 'bold 80px Arial';
        ctx.fillStyle = '#ffff00';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        // ctx.fillText('          ∞', 64, 64);
        const texture = new THREE.CanvasTexture(canvas);
        const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
        const infinitySprite = new THREE.Sprite(spriteMat);
        infinitySprite.scale.set(0.6, 0.6, 1);
        infinityMarker.add(infinitySprite);

        // ============================================================
        // RIGID TORUS SETUP (R3 VIEW)
        // ============================================================
        let rigidTorusMesh, rigidWireframeMesh;
        let lastR = -1;

        function createRigidTorus(R) {
            if (rigidTorusMesh) {
                sceneR3.remove(rigidTorusMesh);
                rigidTorusMesh.geometry.dispose();
                sceneR3.remove(rigidWireframeMesh);
                rigidWireframeMesh.geometry.dispose();
            }
            const r = Math.sqrt(Math.max(0.001, 1 - R * R));
            const majorRadius = 1 / R;
            const minorRadius = r / R;
            
            const geom = new THREE.TorusGeometry(majorRadius, minorRadius, 64, 144);
            const posAttr = geom.attributes.position;
            const colAttr = new THREE.Float32BufferAttribute(posAttr.count * 3, 3);
            const color = new THREE.Color();
            
            const tubularSegments = geom.parameters.tubularSegments;
            const radialSegments = geom.parameters.radialSegments;
            
            for (let j = 0; j <= radialSegments; j++) {
                const beta = (j / radialSegments) * 2 * Math.PI;
                for (let i = 0; i <= tubularSegments; i++) {
                    const alpha = (i / tubularSegments) * 2 * Math.PI;
                    const idx = (j * (tubularSegments + 1) + i) * 3;
                    // Lighter base lightness (0.5 instead of 0.3) for see-through effect
                    const lightness = 0.5 + 0.35 * ((r * Math.sin(beta) + 1) / 2);
                    color.setHSL(alpha / (2 * Math.PI), 0.6, lightness);
                    colAttr.setXYZ(idx / 3, color.r, color.g, color.b);
                }
            }
            geom.setAttribute('color', colAttr);

            const mat = new THREE.MeshPhongMaterial({
                vertexColors: true,
                side: THREE.DoubleSide,
                shininess: 40,
                specular: 0x202040,
                transparent: true,
                opacity: 0.35 // More see-through
            });
            rigidTorusMesh = new THREE.Mesh(geom, mat);
            sceneR3.add(rigidTorusMesh);

            const wireMat = new THREE.MeshBasicMaterial({
                color: 0x000000,
                wireframe: true,
                transparent: true,
                opacity: 0.05
            });
            rigidWireframeMesh = new THREE.Mesh(geom, wireMat);
            sceneR3.add(rigidWireframeMesh);
        }

        // ============================================================
        // COLOR STATE
        // ============================================================
        let colorL = { r: 0xff, g: 0x30, b: 0x30 };
        let colorM = { r: 0x30, g: 0xff, b: 0x30 };

        function applyColors() {
            const setMatColor = (mat, c) => {
                mat.color.setRGB(c.r / 255, c.g / 255, c.b / 255);
                if (mat.emissive) mat.emissive.setRGB(c.r / 5 / 255, c.g / 5 / 255, c.b / 5 / 255);
            };
            setMatColor(curveL_S3.mat, colorL);
            setMatColor(curveM_S3.mat, colorM);
            setMatColor(curveL_R3.mat, colorL);
            setMatColor(curveM_R3.mat, colorM);

            const hexL = '#' + colorL.r.toString(16).padStart(2,'0') + colorL.g.toString(16).padStart(2,'0') + colorL.b.toString(16).padStart(2,'0');
            const hexM = '#' + colorM.r.toString(16).padStart(2,'0') + colorM.g.toString(16).padStart(2,'0') + colorM.b.toString(16).padStart(2,'0');
            
            document.getElementById('lblLocL').style.color = hexL;
            document.getElementById('lblRevL').style.color = hexL;
            document.getElementById('lblLocM').style.color = hexM;
            document.getElementById('lblRevM').style.color = hexM;
        }

        function swapColors() {
            const temp = { ...colorL };
            colorL = { ...colorM };
            colorM = { ...temp };
            applyColors();
        }

        // ============================================================
        // PROJECTION HELPERS
        // ============================================================
        function projectToBall(x1, x2, x3, x4) {
            const x4sq = x4 * x4;
            const s = Math.sqrt(Math.max(0, 1 - x4sq));
            const denom = 1 - x4 + s;
            if (denom < 1e-4) {
                const norm = Math.sqrt(x1*x1 + x2*x2 + x3*x3);
                return norm < 1e-6 ? [0, 0, 0.999] : [x1/norm * 0.999, x2/norm * 0.999, x3/norm * 0.999];
            }
            let U = x1 / denom, V = x2 / denom, W = x3 / denom;
            const dist = Math.sqrt(U*U + V*V + W*W);
            if (dist > 0.999) {
                const scale = 0.999 / dist;
                U *= scale; V *= scale; W *= scale;
            }
            return [U, V, W];
        }

        function transformPoint(x1, x2, x3, x4, cosT1, sinT1, cosT2, sinT2, cosT3, sinT3) {
            let nx1 = x1 * cosT1 - x3 * sinT1;
            let nx3 = x1 * sinT1 + x3 * cosT1;
            x1 = nx1; x3 = nx3;
            
            let nx2 = x2 * cosT2 - x4 * sinT2;
            let nx4 = x2 * sinT2 + x4 * cosT2;
            x2 = nx2; x4 = nx4;
            
            nx1 = x1 * cosT3 - x4 * sinT3;
            nx4 = x1 * sinT3 + x4 * cosT3;
            x1 = nx1; x4 = nx4;
            
            return projectToBall(x1, x2, x3, x4);
        }

        // ============================================================
        // UPDATE FUNCTIONS
        // ============================================================
        const _up = new THREE.Vector3(0, 1, 0);
        const _dir = new THREE.Vector3();
        const _pos = new THREE.Vector3();
        const _posNext = new THREE.Vector3();
        const _quat = new THREE.Quaternion();

        function updateRigidCurves(R, betaLocL, alphaLocM, revL, revM) {
            const r = Math.sqrt(Math.max(0.001, 1 - R * R));
            const majorRadius = 1 / R;
            const minorRadius = r / R;

            const updateCurve = (curveObj, isL) => {
                const posArr = curveObj.geom.attributes.position.array;
                const pts = [];
                for (let k = 0; k < NUM_CURVE_PTS; k++) {
                    const t = (k / NUM_CURVE_PTS) * 2 * Math.PI;
                    const angle = (isL ? revL : revM) ? (2 * Math.PI - t) : t;
                    const fixedAngle = isL ? betaLocL : alphaLocM;
                    
                    const alpha = isL ? angle : fixedAngle;
                    const beta = isL ? fixedAngle : angle;
                    
                    // Standard rigid 3D torus parametric equations
                    const x = (majorRadius + minorRadius * Math.cos(beta)) * Math.cos(alpha);
                    const y = (majorRadius + minorRadius * Math.cos(beta)) * Math.sin(alpha);
                    const z = minorRadius * Math.sin(beta);
                    
                    posArr[k*3] = x; posArr[k*3+1] = y; posArr[k*3+2] = z;
                    pts.push([x, y, z]);
                }
                curveObj.geom.attributes.position.needsUpdate = true;

                for (let k = 0; k < NUM_MARKERS; k++) {
                    const idx = Math.floor((k / NUM_MARKERS) * NUM_CURVE_PTS);
                    const idxNext = (idx + 1) % NUM_CURVE_PTS;
                    _pos.set(pts[idx][0], pts[idx][1], pts[idx][2]);
                    _posNext.set(pts[idxNext][0], pts[idxNext][1], pts[idxNext][2]);
                    _dir.subVectors(_posNext, _pos).normalize();
                    if (_dir.length() > 1e-6) {
                        _quat.setFromUnitVectors(_up, _dir);
                        curveObj.markers[k].quaternion.copy(_quat);
                    }
                    curveObj.markers[k].position.copy(_pos);
                }
            };

            updateCurve(curveL_R3, true);
            updateCurve(curveM_R3, false);
        }

        function updateInfinityMarker(t1, t2, t3) {
    // Position of the north pole (0,0,0,1) after inverse rotation
    const x1 = Math.sin(t3) * Math.cos(t1);
    const x2 = Math.cos(t3) * Math.sin(t2);
    const x3 = -Math.sin(t3) * Math.sin(t1);
    const x4 = Math.cos(t3) * Math.cos(t2);
    
    const denom = 1 - x4;
    const MAX_DIST = 12; // Maximum distance from origin before clamping
    
    if (denom < 0.01) {
        // Very close to infinity - place marker at max distance in the correct direction
        const norm = Math.sqrt(x1*x1 + x2*x2 + x3*x3);
        if (norm > 1e-6) {
            infinityMarker.position.set((x1/norm)*MAX_DIST, (x2/norm)*MAX_DIST, (x3/norm)*MAX_DIST);
        }
        infinityMarker.scale.set(1.2, 1.2, 1.2);
        infinityMarker.material.opacity = 0.6; // Fade slightly when very far
    } else {
        const U = x1 / denom;
        const V = x2 / denom;
        const W = x3 / denom;
        const dist = Math.sqrt(U*U + V*V + W*W);
        
        // Smoothly clamp distance
        if (dist > MAX_DIST) {
            const scale = MAX_DIST / dist;
            infinityMarker.position.set(U * scale, V * scale, W * scale);
            infinityMarker.material.opacity = Math.max(0.4, 1.0 - (dist - MAX_DIST) * 0.1);
        } else {
            infinityMarker.position.set(U, V, W);
            infinityMarker.material.opacity = 0.9;
        }
        
        // Consistent scale based on distance (closer = larger)
        const markerScale = Math.max(0.8, Math.min(1.5, 3.0 / (dist + 1.0)));
        infinityMarker.scale.set(markerScale, markerScale, markerScale);
    }
    
    // Always face the camera
    infinityMarker.lookAt(cameraR3.position);
}

        function updateTorus(t1, t2, t3, R) {
            const r = Math.sqrt(Math.max(0, 1 - R * R));
            const positions = torusGeom.attributes.position.array;
            const colors = torusGeom.attributes.color.array;
            
            const cosT1 = Math.cos(t1), sinT1 = Math.sin(t1);
            const cosT2 = Math.cos(t2), sinT2 = Math.sin(t2);
            const cosT3 = Math.cos(t3), sinT3 = Math.sin(t3);
            
            const color = new THREE.Color();
            let maxDist = 0;
            
            const betaLocL = parseFloat(document.getElementById('locL').value);
            const alphaLocM = parseFloat(document.getElementById('locM').value);
            const revL = document.getElementById('revL').checked;
            const revM = document.getElementById('revM').checked;
            
            document.getElementById('vLocL').textContent = betaLocL.toFixed(2);
            document.getElementById('vLocM').textContent = alphaLocM.toFixed(2);

            // Update S3 Torus
            for (let i = 0; i < NA; i++) {
                const alpha = (i / NA) * 2 * Math.PI;
                const cosA = Math.cos(alpha), sinA = Math.sin(alpha);
                for (let j = 0; j < NB; j++) {
                    const beta = (j / NB) * 2 * Math.PI;
                    const cosB = Math.cos(beta), sinB = Math.sin(beta);
                    const [U, V, W] = transformPoint(R * cosA, R * sinA, r * cosB, r * sinB, cosT1, sinT1, cosT2, sinT2, cosT3, sinT3);
                    const idx = (i * NB + j) * 3;
                    positions[idx] = U; positions[idx + 1] = V; positions[idx + 2] = W;
                    const d = Math.sqrt(U*U + V*V + W*W);
                    if (d > maxDist) maxDist = d;
                    color.setHSL(alpha / (2 * Math.PI), 0.7, 0.3 + 0.45 * ((r * sinB + 1) / 2));
                    colors[idx] = color.r; colors[idx + 1] = color.g; colors[idx + 2] = color.b;
                }
            }
            torusGeom.attributes.position.needsUpdate = true;
            torusGeom.attributes.color.needsUpdate = true;
            torusGeom.computeVertexNormals();

            // Update S3 Curves
            const updateCurveS3 = (curveObj, isL) => {
                const posArr = curveObj.geom.attributes.position.array;
                const pts = [];
                for (let k = 0; k < NUM_CURVE_PTS; k++) {
                    const t = (k / NUM_CURVE_PTS) * 2 * Math.PI;
                    const angle = (isL ? revL : revM) ? (2 * Math.PI - t) : t;
                    const fixedAngle = isL ? betaLocL : alphaLocM;
                    const x1 = isL ? R * Math.cos(angle) : R * Math.cos(fixedAngle);
                    const x2 = isL ? R * Math.sin(angle) : R * Math.sin(fixedAngle);
                    const x3 = isL ? r * Math.cos(fixedAngle) : r * Math.cos(angle);
                    const x4 = isL ? r * Math.sin(fixedAngle) : r * Math.sin(angle);
                    const proj = transformPoint(x1, x2, x3, x4, cosT1, sinT1, cosT2, sinT2, cosT3, sinT3);
                    posArr[k*3] = proj[0]; posArr[k*3+1] = proj[1]; posArr[k*3+2] = proj[2];
                    pts.push(proj);
                }
                curveObj.geom.attributes.position.needsUpdate = true;
                for (let k = 0; k < NUM_MARKERS; k++) {
                    const idx = Math.floor((k / NUM_MARKERS) * NUM_CURVE_PTS);
                    const idxNext = (idx + 1) % NUM_CURVE_PTS;
                    _pos.set(pts[idx][0], pts[idx][1], pts[idx][2]);
                    _posNext.set(pts[idxNext][0], pts[idxNext][1], pts[idxNext][2]);
                    _dir.subVectors(_posNext, _pos).normalize();
                    if (_dir.length() > 1e-6) {
                        _quat.setFromUnitVectors(_up, _dir);
                        curveObj.markers[k].quaternion.copy(_quat);
                    }
                    curveObj.markers[k].position.copy(_pos);
                }
            };
            updateCurveS3(curveL_S3, true);
            updateCurveS3(curveM_S3, false);

            // Boundary glow
            const glow = Math.max(0, (maxDist - 0.75) / 0.25);
            boundaryWire.material.opacity = 0.15 + 0.4 * glow;
            boundaryWire.material.color.setHSL(0.65, 0.6, 0.4 + 0.3 * glow);
        }

        // ============================================================
        // UI CONTROLS
        // ============================================================
        const slider1 = document.getElementById('t1');
        const slider2 = document.getElementById('t2');
        const slider3 = document.getElementById('t3');
        const sliderR = document.getElementById('R');

        function onInput() {
            const t1 = parseFloat(slider1.value);
            const t2 = parseFloat(slider2.value);
            const t3 = parseFloat(slider3.value);
            const R = parseFloat(sliderR.value);
            
            document.getElementById('v1').textContent = t1.toFixed(2);
            document.getElementById('v2').textContent = t2.toFixed(2);
            document.getElementById('v3').textContent = t3.toFixed(2);
            document.getElementById('vR').textContent = R.toFixed(3);
            
            // Update rigid torus only if R changed significantly
            if (Math.abs(lastR - R) > 0.001) {
                createRigidTorus(R);
                lastR = R;
            }
            
            const betaLocL = parseFloat(document.getElementById('locL').value);
            const alphaLocM = parseFloat(document.getElementById('locM').value);
            const revL = document.getElementById('revL').checked;
            const revM = document.getElementById('revM').checked;
            
            updateRigidCurves(R, betaLocL, alphaLocM, revL, revM);
            updateInfinityMarker(t1, t2, t3);
            updateTorus(t1, t2, t3, R);
            
            boundaryGroup.visible = document.getElementById('showBoundary').checked;
            wireframeMesh.visible = document.getElementById('showWireframe').checked;
            rigidWireframeMesh.visible = document.getElementById('showWireframe').checked;
            
            curveL_S3.mat.visible = document.getElementById('showL').checked;
            curveM_S3.mat.visible = document.getElementById('showM').checked;
            curveL_S3.group.visible = curveM_S3.group.visible = document.getElementById('showMarkers').checked;
            
            curveL_R3.mat.visible = document.getElementById('showL').checked;
            curveM_R3.mat.visible = document.getElementById('showM').checked;
            curveL_R3.group.visible = curveM_R3.group.visible = document.getElementById('showMarkers').checked;
            
            infinityMarker.visible = document.getElementById('showMarkers').checked;
        }

        [slider1, slider2, slider3, sliderR, document.getElementById('locL'), document.getElementById('locM')].forEach(el => {
            el.addEventListener('input', onInput);
        });
        [document.getElementById('showBoundary'), document.getElementById('showWireframe'), document.getElementById('showL'), document.getElementById('showM'), document.getElementById('showMarkers'), document.getElementById('revL'), document.getElementById('revM')].forEach(el => {
            el.addEventListener('change', onInput);
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            slider1.value = 0; slider2.value = 0; slider3.value = 0;
            sliderR.value = 0.707;
            document.getElementById('locL').value = 0;
            document.getElementById('locM').value = 0;
            document.getElementById('revL').checked = false;
            document.getElementById('revM').checked = false;
            colorL = { r: 0xff, g: 0x30, b: 0x30 };
            colorM = { r: 0x30, g: 0xff, b: 0x30 };
            applyColors();
            autoRotate = false;
            document.getElementById('animateBtn').textContent = 'Auto-animate';
            onInput();
        });

        document.getElementById('swapColorsBtn').addEventListener('click', swapColors);

        let autoRotate = true;
        let autoRotateTime = 0;
        document.getElementById('animateBtn').addEventListener('click', () => {
            autoRotate = !autoRotate;
            document.getElementById('animateBtn').textContent = autoRotate ? 'Stop' : 'Auto-animate';
        });

        applyColors();
        onInput();

        // ============================================================
        // ANIMATION LOOP
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);
            
            if (autoRotate) {
                autoRotateTime += 0.003;
                slider1.value = (Math.sin(autoRotateTime * 0.7) * 1.3).toFixed(2);
                slider2.value = (Math.sin(autoRotateTime * 1.1 + 1) * 1.3).toFixed(2);
                slider3.value = (Math.sin(autoRotateTime * 0.5 + 2) * 1.3).toFixed(2);
                onInput();
            }
            
            controls.update();
            
            const width = window.innerWidth;
            const height = window.innerHeight;
            const halfWidth = Math.floor(width / 2);
            
            renderer.setScissorTest(true);
            
            // Left View: S3
            renderer.setScissor(0, 0, halfWidth, height);
            renderer.setViewport(0, 0, halfWidth, height);
            cameraS3.aspect = halfWidth / height;
            cameraS3.updateProjectionMatrix();
            renderer.render(sceneS3, cameraS3);
            
            // Right View: R3
            renderer.setScissor(halfWidth, 0, width - halfWidth, height);
            renderer.setViewport(halfWidth, 0, width - halfWidth, height);
            cameraR3.aspect = (width - halfWidth) / height;
            cameraR3.updateProjectionMatrix();
            renderer.render(sceneR3, cameraR3);
            
            renderer.setScissorTest(false);
        }
        animate();

        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const halfWidth = Math.floor(width / 2);
            
            cameraS3.aspect = halfWidth / height;
            cameraS3.updateProjectionMatrix();
            
            cameraR3.aspect = (width - halfWidth) / height;
            cameraR3.updateProjectionMatrix();
            
            renderer.setSize(width, height);
        });

        // ============================================================
// SPACEBAR PLAY/PAUSE
// ============================================================
window.addEventListener('keydown', (event) => {
    if (event.code === 'Space') {
        event.preventDefault(); // Prevent the browser from scrolling down
        autoRotate = !autoRotate;
        document.getElementById('animateBtn').textContent = autoRotate ? 'Stop' : 'Auto-animate';
    }
});
    </script>
</body>
